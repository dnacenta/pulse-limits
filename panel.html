<body>
<div id="screen">
  <canvas id="c"></canvas>
</div>
<script>
(() => {
  // =========================================================================
  // shared core: data, activity, formatting, ECG model, drawing primitives
  // =========================================================================
  // ---- data ------------------------------------------------------------------
  function load() {
    try {
      const h = location.hash.slice(1); if (!h) return null;
      const bytes = Uint8Array.from(atob(h), c => c.charCodeAt(0));
      return JSON.parse(new TextDecoder().decode(bytes));
    } catch (e) { return null; }
  }
  const D = { plan: '', source: '', fetched: 0, status: 'NO DATA', hint: '', windows: [], history: [],
              credits: null, activity: null, theme: 'orbit', provider: '', providers: [] };
  let session = null, others = [], sessionPct = 0, alive = false;
  const act = { tok: null, idle: null, sessions: 0 };   // the active provider's reading; the popover feeds it every 2 s
  const actOf = a => a && typeof a.tok_per_min === 'number' ? { tok: a.tok_per_min, idle: a.idle_s, sessions: a.sessions || 0 } : null;
  // with more than one provider on the monitor every SESSION and WEEK window says whose it is (CLAUDE WEEK, GROK WEEK);
  // a window named after a model or a product (FABLE, GPT-5) keeps its own name
  const multi = () => (D.providers || []).length > 1;
  const qualify = (name, w) => { if (w.label !== 'SESSION' && w.label !== 'WEEK') return w; const word = w.label === 'WEEK' ? '7D' : w.label; return Object.assign({}, w, { label: name + ' ' + word, prov: name, word }); };
  const sessionLabel = () => multi() && D.provider ? qualify(D.provider.toUpperCase(), session || { label: 'SESSION' }).label : 'SESSION';
  // one trace per provider with an activity reading of its own (providers[i].activity; absent counts as null), when
  // more than one has one: the active provider's lane follows `act`, the others the payload. Else the single trace, as ever.
  let lanes = [];
  // a provider's headline window: SESSION, or its first one when it has none (a weekly pool only)
  const headOf = ws => ws.find(w => w.label === 'SESSION') || ws[0] || null;
  function derive() {
    // SESSION is the big number; a provider with no session window (a weekly pool only) shows its first one there
    session = headOf(D.windows);
    others = D.windows.filter(w => w !== session);
    if (multi() && D.provider) others = others.map(w => qualify(D.provider.toUpperCase(), w));
    sessionPct = session ? Math.round(session.pct) : 0;
    alive = D.windows.length > 0;
    const srcs = (D.providers || []).filter(p => p.name && actOf(p.activity));
    lanes = srcs.length > 1 ? srcs.map(p => {
      const name = p.name.toUpperCase(), s = headOf(p.windows || []), active = p.name === D.provider;
      // each lane carries a headline beside its trace: the active lane the big number's window, the others their own
      return { key: p.name, name, active, act: active ? act : actOf(p.activity), pct: s ? Math.round(s.pct) : null, ecg: null,
               win: active || !s ? null : qualify(name, s), status: p.status || 'NO DATA' };
    }) : [];
    const laned = new Set(lanes.map(l => l.key));
    // the other providers' windows join the rings, except a lane's headline, which is drawn beside its trace;
    // one with no data is a dead ring that says why (a lane says so in its headline instead)
    for (const p of D.providers || []) {
      if (!p.name || p.name === D.provider) continue;
      const name = p.name.toUpperCase(), ws = p.windows || [], hd = laned.has(p.name) ? headOf(ws) : null;
      if (ws.length) others = others.concat(ws.filter(w => w !== hd).map(w => qualify(name, w)));
      else if (!laned.has(p.name)) others.push({ label: name, pct: 0, resets: null, status: p.status || 'NO DATA' });
    }
  }
  function applyUsage(p) { if (!p || typeof p !== 'object') return; Object.assign(D, p); derive(); }
  applyUsage(load());

  // dead-reckoned session %: anchor from the last API reading plus tokens seen since
  const est = { pct: null, api: null };
  function applyEstimate(e) {
    if (!e || typeof e.pct_est !== 'number') return;
    est.pct = e.pct_est; est.api = e.pct_api;
    if (session && e.calibrated) sessionPct = Math.round(e.pct_est);
  }
  function applyActivity(a) {
    if (!a || typeof a.tok_per_min !== 'number') return;
    act.tok = a.tok_per_min; act.idle = a.idle_s; act.sessions = a.sessions || 0;
    if (a.estimate) applyEstimate(a.estimate);
  }
  applyActivity(D.activity); applyEstimate(D.estimate);
  const estimating = () => est.pct !== null && est.api !== null && Math.round(est.pct) !== Math.round(est.api);
  const THEME = (location.search.match(/theme=(\w+)/) || [])[1] || D.theme || 'orbit';
  window.pulse = { activity: applyActivity, usage: p => {
    est.pct = est.api = null;                       // a fresh reading, maybe of another provider: no stale estimate
    applyUsage(p); applyActivity(p && p.activity); applyEstimate(p && p.estimate);
    if (p && p.theme && p.theme !== THEME && !location.search) {       // theme changed from the menu: reload into it
      location.hash = btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(D))));
      location.reload();
    }
  } };

  // ---- formatting --------------------------------------------------------------
  const pad2 = n => String(n).padStart(2, '0');
  const hhmm = ms => { const d = new Date(ms); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
  function span(ms) {
    let s = Math.max(0, Math.floor(ms / 1000));
    const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
    return d > 0 ? d + 'D ' + pad2(h) + 'H' : h > 0 ? h + 'H ' + pad2(m) + 'M' : m + 'M';
  }
  const short = s => s < 60 ? s + 'S' : s < 3600 ? Math.floor(s / 60) + 'M' : s < 86400 ? Math.floor(s / 3600) + 'H' : Math.floor(s / 86400) + 'D';
  const fmtK = n => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 'K' : String(n);
  const resetMs = w => { const r = w && w.resets ? Date.parse(w.resets) : NaN; return isNaN(r) ? NaN : r - Date.now(); };
  const resetText = w => { if (w && w.status) return w.status; const m = resetMs(w); return (isNaN(m) ? 'RESET ?' : 'RESET ' + span(m)) + (w === session && estimating() ? ' · EST' : ''); };
  const pctText = w => w.status ? '?' : Math.round(w.pct) + '%';
  // what a lane's headline says: the label, the percentage (null with no reading), its window for the reset, and,
  // with no reading, why: the active lane's is the big number's (estimate and EST marker included), the others' their own
  function headline(l) {
    const w = l.active ? session : l.win, pct = l.active ? (alive ? sessionPct : null) : w ? Math.round(w.pct) : null;
    const status = l.active ? (alive ? '' : 'NO SIGNAL') : w ? '' : l.status;
    return { label: l.active ? sessionLabel() : w ? w.label : l.name + ' SESSION', pct, text: pct === null ? '--' : pct + '%', win: w, sub: status || resetText(w), dead: !!status };
  }
  // the plan badge names the provider when more than one is on the monitor
  const planBadge = () => (D.providers || []).length > 1 && D.provider ? D.provider.toUpperCase() + (D.plan ? ' · ' + D.plan : '') : D.plan;
  const ageSec = () => Math.max(0, Math.floor(Date.now() / 1000 - D.fetched));
  const fresh = () => alive && !D.status && ageSec() < 120;
  function nextReset() {
    const now = Date.now(), ts = D.windows.map(w => Date.parse(w.resets)).filter(v => v > now);
    return ts.length ? hhmm(Math.min(...ts)) : '?';
  }
  const bpmOf = a => a.tok > 0 ? Math.min(180, 60 + 60 * Math.log10(1 + a.tok / 100)) : 0;   // nothing streaming: flat line
  function bpmNow() {
    if (!alive) return 0;
    if (act.tok === null) return 60;               // unknown (no helper): a resting pulse
    return bpmOf(act);
  }
  const laneBpm = l => l.active && !alive ? 0 : bpmOf(l.act);   // a lane beats from its own provider's tokens
  const busyOf = a => a.tok !== null && a.tok > 0;
  const busy = () => busyOf(act);
  function labelOf(a) {
    if (a.tok === null) return null;
    if (a.tok > 0) return fmtK(a.tok) + ' TOK/MIN' + (a.sessions > 1 ? ' · ' + a.sessions + ' SESSIONS' : '');
    return 'IDLE ' + short(a.idle);
  }
  const activityLabel = () => labelOf(act);
  // status line pieces: [text, kind] kind = ok | stale | dead | old
  function statusInfo(t) {
    if (!alive) return ['? ' + D.status, 'dead'];
    if (D.status) return ['○ ' + D.status, 'stale'];
    if (fresh()) return [(Math.floor(t / 1000) % 2 ? '● ' : '  ') + 'LIVE', 'ok'];
    return ['', 'old'];
  }
  function buckets(n) {                     // 12 h of session history in n buckets (max per bucket, -1 empty)
    const now = Date.now(), bucketMs = 12 * 3600 * 1000 / n, max = new Array(n).fill(-1);
    for (const [ts, pct] of D.history) {
      const b = n - 1 - Math.floor((now - ts * 1000) / bucketMs);
      if (b >= 0 && b < n) max[b] = Math.max(max[b], pct);
    }
    return max;
  }

  // ---- canvas ------------------------------------------------------------------

    txt('SESSION · 12H', tx, dy + 24, m(500, 7.5), OP.sub, 'left', 1.2);
    txt('Twelve hours,', tx, dy + 42, f(700, 11.5), OP.ink); txt('one turn of the dial.', tx, dy + 56, f(700, 11.5), OP.ink);
    [['this hour', OP.gold], ['busy hours', OP.moss], ['quiet hours', OP.olive]].forEach(([l, c], i) => {
      card(tx, dy + 68 + i * 11, 10, 3, 1.5, c); txt(l, tx + 15, dy + 72 + i * 11, m(400, 7.5), OP.body);
    });

    // the heartbeat, across the bottom
    const lab = actText(act);
    if (lab !== null) { dot(15, 233, 2.3, OP.rust); txt(lab, 22, 236, f(500, 9.5), OP.sand); }
    emberTrace(ECG, 12, 262, 22, { line: OP.gold, dot: OP.rust, dim: OP.line2, idle: !alive || (act.tok !== null && !busy()) }, t);
    footer(OP.sub, t);
  }};
  function orbitLanes(t) {
    const n = lanes.length, gap = 8, cw = (480 - (n - 1) * gap) / n, y = 32, h = 212, rows = [];
    lanes.forEach((l, i) => {
      const x = 10 + i * (cw + gap), hd = headline(l), cx = x + cw / 2, pct = hd.pct === null ? 0 : hd.pct;
      card(x, y, cw, h, 16, OP.card, OP.line);
      const nw = txt(provName(l.key), x + 10, y + 18, f(800, 12.5), OP.ink);
      const plan = planOf(l); if (plan) pill(plan, x + 16 + nw, y + 14, m(400, 7.5), OP.body, OP.pill, OP.line2);
      if (l.active && n > 1) { const iw = measure('in bar', m(400, 7)) + 10; card(x + cw - 8 - iw, y + 30, iw, 12, 6, OP.card, '#685742'); txt('in bar', x + cw - 8 - iw / 2, y + 39, m(400, 7), OP.sand, 'center'); }
      orbitBig(cx, y + 86, .29, pct, t, hd.text === '--' ? '—' : hd.text, hd.pct !== null);
      const word = laneWord(hd), rs = hd.dead ? sentence(hd.sub) : word + ' · resets in ' + later(hd.win);
      txt(rs, cx, y + 142, f(400, 8.5), hd.dead ? OP.bad : OP.body, 'center');
      const lab = actText(l.act), idle = !busyOf(l.act);
      dot(x + 13, y + 155, 2, idle ? '#4a4a40' : OP.rust); txt(lab === null ? 'no reading' : lab, x + 19, y + 158, f(500, 8), idle ? OP.sub : OP.sand);
      emberTrace(laneEcg(l), x + 8, y + 178, 10, { line: OP.gold, dot: OP.rust, dim: OP.line2, idle, width: 1.3, r: 2 }, t);
      extrasOf(l).slice(0, 2).forEach((w, k) => {
        const yy = y + 194 + k * 12, p = Math.round(w.pct);
        txt(nice(w.label), x + 10, yy, f(500, 8), OP.body); txt(pctText(w), x + cw - 10, yy, f(700, 8), OP.ink, 'right');
        card(x + 58, yy - 4, cw - 98, 3, 1.5, OP.line); if (!w.status) card(x + 58, yy - 4, Math.max(3, (cw - 98) * p / 100), 3, 1.5, otone(p));
      });
    });
    // the dial for the provider in the bar, and the resets coming up
    card(10, 250, 480, H - 270, 14, OP.card, OP.line);
    dial(34, 250 + (H - 270) / 2, .19, t);
    txt('SESSION · 12H', 60, 264, m(500, 7), OP.sub, 'left', 1.1);
    txt(provName(D.provider) + ', in your bar', 60, 277, f(600, 9), OP.ink);
    const soon = [];
    for (const p of D.providers || []) for (const w of p.windows || []) { const ms = resetMs(w); if (!isNaN(ms) && ms > 0) soon.push({ ms, w, p }); }
    soon.sort((a, b) => a.ms - b.ms).slice(0, 3).forEach(({ ms, w, p }, i) => {
      const xx = 196 + i * 98; txt(hhmm(Date.now() + ms), xx, 266, m(500, 9), OP.gold);
      txt(provName(p.name) + ' ' + niceWord(w.label).toLowerCase(), xx, 278, f(500, 8), OP.body);
    });
    footer(OP.sub, t);
  }

  // ---- EMBER: usage as heat ----------------------------------------------------------------
  // warm brown cards; the number, bar and rings run sand → gold (50%) → rust (85%); the trend glows like coals
  const EP = { page: '#15120f', bg: '#1d1915', card: '#26201a', track: '#3d3428', pill: '#2e261d', ink: '#e9e2c4', body: '#c2c2b0',
               muted: '#a69a80', sand: '#d7c483', gold: '#c9a554', rust: '#bb7744', coal: '#8f6a40', brown: '#685742', idle: '#4a3f33',
               live: '#c9a554', liveText: '#d7c483', liveGlow: true, warn: '#c9a554', bad: '#bb7744', ringW: 4.5 };
  const etone = p => p >= 85 ? EP.rust : p >= 50 ? EP.gold : EP.sand;
  const ecoal = v => v >= 68 ? EP.rust : v >= 60 ? EP.gold : v >= 40 ? EP.coal : v >= 12 ? EP.brown : EP.track;
  function heatLegend(x, y) {          // right-aligned at x
    let cx = x;
    for (const [l, c] of [['85%', EP.rust], ['50%', EP.gold], ['<50%', EP.sand]]) { cx -= measure(l, m(400, 7.5)); txt(l, cx, y, m(400, 7.5), c); cx -= 7; dot(cx + 2, y - 2.6, 2.4, c); cx -= 7; }
    txt('heat', cx, y, m(400, 7.5), EP.body, 'right');
  }
  function glowText(s, x, y, font, color, align, t, base = 6) {
    ctx.shadowColor = 'rgba(201,165,84,.45)'; ctx.shadowBlur = base + 7 * wave(t, 4); txt(s, x, y, font, color, align); ctx.shadowBlur = 0;
  }
  function embers(list, t) {           // sparks rising off the hottest coals
    list.filter(b => b.v >= 60).forEach((b, i) => {
      for (let k = 0; k < 2; k++) {
        const ph = RM ? .4 : ((t / 1000) / (2.2 + k * .7) + i * .37 + k * .5) % 1;
        dot(b.x + 2 + (k ? 3 : -1), b.top - 3 - ph * 16, k ? 1.1 : 1.4, k ? EP.rust : EP.sand, ph < .15 ? ph / .15 : 1 - ph);
      }
    });
  }
  THEMES.ember = { ecg: 270, speed: 100, laneEcg: () => 184, draw(t) {
    document.body.style.background = EP.page;
    ctx.fillStyle = EP.bg; ctx.fillRect(0, 0, W, H);
    let x = 14 + wordmark(14, 22, 15, EP.ink, EP.rust) + 8;
    if (lanes.length) pill(lanes.length + ' providers', x, 17, f(600, 8.5), EP.sand, EP.pill);
    else if (D.plan) pill(planNice(D.plan), x, 17, f(600, 8.5), EP.sand, EP.pill);
    status(W - 14, 21, t, EP);
    if (lanes.length) { heatLegend(W - 70, 21); return emberLanes(t); }

    card(10, 32, 480, 116, 12, EP.card);
    const lab = actText(act);
    if (lab !== null) { dot(25, 45, 2.2, EP.rust); txt(lab, 31, 48, f(500, 9.5), EP.sand); }
    emberTrace(ECG, 22, 102, 27, { line: EP.gold, dot: EP.rust, dim: EP.brown, idle: !alive || (act.tok !== null && !busy()), width: 1.4 }, t);
    const col = !alive ? EP.muted : etone(sessionPct);
    txt('Session', 476, 52, f(500, 10), EP.body, 'right');
    glowText(alive ? sessionPct + '%' : '—', 478, 98, f(800, 50), col, 'right', t);
    if (alive) txt('Resets in ' + later(session) + (estimating() ? ' · est' : ''), 476, 113, f(500, 10), EP.body, 'right');
    else if (Math.floor(t / 600) % 2) txt('No signal', 476, 113, f(600, 10), EP.bad, 'right');
    heatLegend(476, 128);
    card(24, 137, 452, 4, 2, EP.track);
    if (alive) card(24, 137, Math.max(4, 452 * sessionPct / 100), 4, 2, col);

    const nr = Math.min(others.length, 4), small = nr > 2, cw = small ? 74 : 96;
    others.slice(0, nr).forEach((w, i) => {
      const cx0 = 10 + i * (cw + 8), pct = Math.round(w.pct);
      card(cx0, 156, cw, 106, 12, EP.card);
      txt(nice(w.label), cx0 + 10, 174, fitFont([nice(w.label)], [f(500, 10), f(500, 8.5), f(500, 7.5)], cw - 16), EP.body);
      if (small) {
        gauge(cx0 + cw / 2, 212, 16, w, pct, EP, w.status ? EP.muted : etone(pct), f(700, 10));
        txt(w.status ? sentence(w.status) : later(w), cx0 + cw / 2, 248, f(500, 8.5), w.status ? EP.bad : EP.body, 'center');
      } else {
        gauge(cx0 + 30, 218, 18, w, pct, EP, w.status ? EP.muted : etone(pct), f(700, 11));
        if (w.status) txt(sentence(w.status), cx0 + cw / 2, 252, f(500, 8), EP.bad, 'center');
        else { txt(later(w), cx0 + 54, 215, f(500, 9), EP.body); txt('reset', cx0 + 54, 227, f(500, 9), EP.body); }
      }
    });
    const tx = 10 + nr * (cw + 8), tw0 = 490 - tx;
    card(tx, 156, tw0, 106, 12, EP.card);
    txt('Session · 12h', tx + 12, 174, f(500, 10), EP.body);
    const hot = bars(tx + 12, 242, tw0 - 24, 54, 4, 2, ecoal, EP.track, 1.5);
    hot.filter(b => b.v >= 60).forEach(b => { ctx.shadowColor = 'rgba(187,119,68,.6)'; ctx.shadowBlur = 5 + 6 * wave(t + b.x * 40, 3); ctx.fillStyle = b.c; rr(b.x, b.top, 4, 242 - b.top, 1.5); ctx.fill(); ctx.shadowBlur = 0; });
    embers(hot, t);
    txt('−12h', tx + 12, 255, m(400, 7.5), EP.body); txt('now', tx + tw0 - 12, 255, m(400, 7.5), EP.body, 'right');
    footer(EP.muted, t);
  }};
  function emberLanes(t) {
    const n = lanes.length, gap = 6, top = 32, lh = Math.min(80, (210 - (n - 1) * gap) / n);
    lanes.forEach((l, i) => {
      const y = top + i * (lh + gap), hd = headline(l), idle = !busyOf(l.act), col = hd.pct === null ? EP.muted : etone(hd.pct);
      card(10, y, 480, lh, 12, EP.card);
      const name = provName(l.key), nw = txt(name, 22, y + 17, f(800, 12.5), EP.ink);
      if (l.key === 'codex') txt('Codex', 26 + nw, y + 17, f(500, 8), EP.muted);
      const plan = planOf(l); if (plan) pill(plan, 22, y + 30, f(600, 7.5), EP.sand, EP.pill);
      const lab = actText(l.act);
      dot(25, y + lh - 12.5, 2, idle ? EP.idle : EP.rust); txt(lab === null ? 'no reading' : lab, 31, y + lh - 10, f(500, 8), idle ? EP.muted : EP.sand);
      emberTrace(laneEcg(l), 124, y + lh * .6, lh * .3, { line: EP.gold, dot: EP.rust, dim: EP.brown, idle, width: 1.3, r: 2 }, t);
      txt(laneWord(hd), 392, y + 14, f(500, 8), EP.body, 'right');
      glowText(hd.pct === null ? '—' : hd.text, 393, y + 40, f(800, 25), col, 'right', t, 3);
      txt(hd.dead ? sentence(hd.sub) : 'Resets in ' + later(hd.win), 392, y + 51, f(500, 7.5), hd.dead ? EP.bad : EP.body, 'right');
      card(316, y + 55, 76, 3, 1.5, EP.track); if (hd.pct !== null) card(316, y + 55, Math.max(3, 76 * hd.pct / 100), 3, 1.5, col);
      extrasOf(l).slice(0, 2).forEach((w, k) => {
        const cx = 418 + k * 36, p = Math.round(w.pct);
        gauge(cx, y + 24, 10, w, p, { track: EP.track, ink: EP.ink, ringW: 3 }, w.status ? EP.muted : etone(p), f(700, 7));
        txt(nice(w.label), cx, y + 46, f(500, 7), EP.body, 'center'); txt(w.status ? '?' : later(w), cx, y + 56, f(500, 7), EP.muted, 'center');
      });
    });
    const by = top + n * (lh + gap) - gap + 6, bh = H - 22 - by;
    card(10, by, 480, bh, 12, EP.card);
    txt('Session · 12h', 22, by + bh / 2 - 1, f(500, 9), EP.body); txt(provName(D.provider) + ', in your bar', 22, by + bh / 2 + 10, f(500, 7.5), EP.muted);
    const hot = bars(150, by + bh - 7, 328, bh - 14, 4, 2, ecoal, EP.track, 1.5);
    hot.filter(b => b.v >= 60).forEach(b => { ctx.shadowColor = 'rgba(187,119,68,.6)'; ctx.shadowBlur = 4 + 5 * wave(t + b.x * 40, 3); ctx.fillStyle = b.c; rr(b.x, b.top, 4, by + bh - 7 - b.top, 1.5); ctx.fill(); ctx.shadowBlur = 0; });
    footer(EP.muted, t);
  }

  // ---- HERBARIUM: the light theme ------------------------------------------------------------
  // cream paper, pressed-specimen cards with an inner hairline, ink type; moss for use, rust for this hour
  const HP = { page: '#d9d0aa', bg: '#e9e2c4', card: '#f2ecd3', border: '#cfc59f', inner: '#e2d8b3', track: '#ddd3ad', ink: '#1a1a1a',
               text2: '#33332c', body: '#4a4636', sub: '#6b6650', moss: '#3f6b3f', olive: '#5e6a35', gold: '#8a6a1e', rust: '#8f4f24',
               act: '#6e5416', pillB: '#c4b98f', live: '#3f6b3f', warn: '#8a6a1e', bad: '#8f4f24', ringW: 4.5 };
  const htone = p => p >= 85 ? HP.rust : p >= 60 ? HP.gold : HP.moss;
  function sheet(x, y, w, h, r) { card(x, y, w, h, r, HP.card, HP.border); ctx.strokeStyle = HP.inner; ctx.lineWidth = 1; rr(x + 4.5, y + 4.5, w - 9, h - 9, Math.max(2, r - 3)); ctx.stroke(); }
  THEMES.herbarium = { ecg: 270, speed: 100, laneEcg: () => 170, draw(t) {
    document.body.style.background = HP.page;
    ctx.fillStyle = HP.bg; ctx.fillRect(0, 0, W, H);
    txt(lanes.length ? 'SPECIMENS · ' + lanes.length + ' PROVIDERS' : 'SPECIMEN · ' + (provName(D.provider) || 'MONITOR').toUpperCase(), 14, 12, m(500, 7), HP.sub, 'left', 1.4);
    const x = 14 + wordmark(14, 28, 15, HP.ink, HP.rust) + 8;
    if (!lanes.length && D.plan) pill(planNice(D.plan), x, 23, m(400, 8.5), HP.text2, HP.card, HP.pillB);
    status(W - 14, 26, t, HP);
    if (lanes.length) return herbLanes(t);

    sheet(10, 36, 480, 122, 11);
    const lab = actText(act);
    if (lab !== null) { dot(25, 51, 2.4, HP.rust); txt(lab, 31, 54, m(500, 8.5), HP.act); }
    emberTrace(ECG, 22, 112, 28, { line: HP.gold, dot: HP.rust, dim: HP.track, idle: !alive || (act.tok !== null && !busy()), width: 1.5, glow: 3 }, t);
    txt('SESSION', 476, 56, m(500, 7.5), HP.sub, 'right', 1.4);
    txt(alive ? sessionPct + '%' : '—', 478, 106, f(800, 52), alive ? HP.ink : HP.sub, 'right');
    if (alive) txt('Resets in ' + later(session) + (estimating() ? ' · est' : ''), 476, 122, f(400, 9.5), HP.body, 'right');
    else if (Math.floor(t / 600) % 2) txt('No signal', 476, 122, f(600, 9.5), HP.bad, 'right');
    card(24, 142, 452, 4, 2, HP.track);
    if (alive) card(24, 142, Math.max(4, 452 * sessionPct / 100), 4, 2, htone(sessionPct));

    const nr = Math.min(others.length, 4), small = nr > 2, cw = small ? 76 : 110;
    others.slice(0, nr).forEach((w, i) => {
      const cx0 = 10 + i * (cw + 7), pct = Math.round(w.pct), c = w.status ? HP.sub : pct >= 60 ? htone(pct) : i % 2 ? HP.rust : HP.moss;
      sheet(cx0, 166, cw, 98, 11);
      txt(nice(w.label).toUpperCase(), cx0 + 11, 182, m(500, small ? 6.5 : 7.5), HP.sub, 'left', 1.1);
      if (small) { gauge(cx0 + cw / 2, 216, 16, w, pct, HP, c, f(800, 10)); txt(w.status ? sentence(w.status) : later(w), cx0 + cw / 2, 251, f(600, 8.5), w.status ? HP.bad : HP.ink, 'center'); }
      else {
        gauge(cx0 + 31, 220, 18, w, pct, HP, c, f(800, 11));
        if (w.status) txt(sentence(w.status), cx0 + cw / 2, 254, f(600, 8), HP.bad, 'center');
        else { txt(later(w), cx0 + 58, 217, f(700, 10), HP.ink); txt('reset', cx0 + 58, 229, f(400, 9), HP.body); }
      }
    });
    const tx = 10 + nr * (cw + 7), tw0 = 490 - tx;
    sheet(tx, 166, tw0, 98, 11);
    txt('SESSION · 12H', tx + 12, 182, m(500, 7.5), HP.sub, 'left', 1.4);
    const rise = .93 + .07 * wave(t, 3);
    bars(tx + 12, 246, tw0 - 24, 54, 4, 2, v => v >= 60 ? HP.rust : HP.olive, HP.border, 1.5)
      .filter(b => b.v >= 60).forEach(b => { ctx.fillStyle = HP.card; rr(b.x - .5, b.top - 1, 5, (246 - b.top) * (1 - rise) + 1, 1.5); ctx.fill(); });
    ctx.fillStyle = HP.border; ctx.fillRect(tx + 12, 246, tw0 - 24, 1);
    txt('−12h', tx + 12, 257, m(400, 7), HP.sub); txt('now', tx + tw0 - 12, 257, m(400, 7), HP.sub, 'right');
    footer(HP.body, t);
  }};
  function herbLanes(t) {
    const n = lanes.length, gap = 6, top = 36, lh = Math.min(80, (206 - (n - 1) * gap) / n);
    lanes.forEach((l, i) => {
      const y = top + i * (lh + gap), hd = headline(l), idle = !busyOf(l.act);
      sheet(10, y, 480, lh, 11);
      txt('SPECIMEN 0' + (i + 1) + ' · ' + (CLI[l.key] || l.name), 22, y + 14, m(500, 6.5), HP.sub, 'left', 1.1);
      const nw = txt(provName(l.key), 22, y + 29, f(800, 12.5), HP.ink);
      const plan = planOf(l); if (plan) pill(plan, 28 + nw, y + 25, m(400, 7), HP.text2, HP.card, HP.pillB);
      const lab = actText(l.act);
      dot(25, y + lh - 12, 2.2, idle ? HP.track : HP.rust); txt(lab === null ? 'no reading' : lab, 31, y + lh - 9.5, m(500, 7.5), idle ? HP.sub : HP.act);
      emberTrace(laneEcg(l), 138, y + lh * .6, lh * .3, { line: HP.gold, dot: HP.rust, dim: HP.border, idle, width: 1.3, r: 2, glow: 3 }, t);
      txt(laneWord(hd).toUpperCase(), 392, y + 14, m(500, 6.5), HP.sub, 'right', 1.1);
      txt(hd.pct === null ? '—' : hd.text, 393, y + 40, f(800, 25), HP.ink, 'right');
      txt(hd.dead ? sentence(hd.sub) : 'Resets in ' + later(hd.win), 392, y + 51, f(400, 7.5), hd.dead ? HP.bad : HP.body, 'right');
      card(318, y + 55, 74, 3, 1.5, HP.track); if (hd.pct !== null) card(318, y + 55, Math.max(3, 74 * hd.pct / 100), 3, 1.5, htone(hd.pct));
      extrasOf(l).slice(0, 2).forEach((w, k) => {
        const cx = 420 + k * 36, p = Math.round(w.pct), c = w.status ? HP.sub : p >= 60 ? htone(p) : k % 2 ? HP.rust : HP.moss;
        gauge(cx, y + 26, 10, w, p, { track: HP.track, ink: HP.ink, ringW: 3 }, c, f(800, 7));
        txt(nice(w.label), cx, y + 47, f(600, 7), HP.text2, 'center'); txt(w.status ? '?' : later(w), cx, y + 57, f(400, 7), HP.body, 'center');
      });
    });
    const by = top + n * (lh + gap) - gap + 6, bh = H - 22 - by;
    sheet(10, by, 480, bh, 11);
    txt('SESSION · 12H', 22, by + bh / 2 - 1, m(500, 7), HP.sub, 'left', 1.2); txt(provName(D.provider) + ', in your bar', 22, by + bh / 2 + 10, f(600, 8), HP.ink);
    bars(150, by + bh - 7, 328, bh - 14, 4, 2, v => v >= 60 ? HP.rust : HP.olive, HP.border, 1.5);
    footer(HP.body, t);
  }

  // =========================================================================
  // run
  // =========================================================================
  const theme = THEMES[THEME] || THEMES.orbit;
  document.body.className = THEME in THEMES ? THEME : 'orbit';
  ECG.init(theme.ecg); ECG.speed = theme.speed;
  const laneWidth = () => typeof theme.laneEcg === 'function' ? theme.laneEcg() : theme.laneEcg || theme.ecg;
  let last = 0;
  function frame(t) {
    const dt = last ? Math.min(.1, (t - last) / 1000) : 0; last = t;
    ECG.step(dt, bpmNow());
    for (const l of lanes) { const e = laneEcg(l); e.init(laneWidth()); e.speed = theme.speed; e.step(dt, laneBpm(l)); }
    theme.draw(t, dt);
    requestAnimationFrame(frame);
  }
  // the embedded faces load before the first frame, or the canvas would draw its first frames in a fallback
  // run each trace for one strip's width first, so the popover opens on a trace already beating, not a flat line
  function warm() {
    const run = (e, bpm) => { for (let k = 0, n = Math.ceil(e.W / (e.speed || 90) / .05); k < n; k++) e.step(.05, bpm); };
    run(ECG, bpmNow());
    for (const l of lanes) { const e = laneEcg(l); e.init(laneWidth()); e.speed = theme.speed; run(e, laneBpm(l)); }
  }
  const start = () => { warm(); requestAnimationFrame(frame); };
  Promise.race([Promise.all([document.fonts.load(f(800, 20)), document.fonts.load(m(500, 10))]), new Promise(r => setTimeout(r, 400))]).then(start, start);
})();
</script>
